[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srai-math"
version = "1.0.0"
description = "Reproducible mathematical utilities for the SRAI learning series"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["srai_math", "srai_math.*"]