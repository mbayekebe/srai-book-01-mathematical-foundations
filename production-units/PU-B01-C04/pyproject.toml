[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srai-math"
version = "1.1.0"
description = "Reusable mathematical implementations for SRAI notebooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "sympy>=1.12",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
  "networkx>=3.2"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyterlab>=4.0", "nbclient>=0.9", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
