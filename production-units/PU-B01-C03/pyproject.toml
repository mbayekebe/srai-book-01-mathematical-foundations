[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srai-math-pu-b01-c03"
version = "1.0.0"
description = "Controlled vector utilities for SRAI PU-B01-C03"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<4",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
]

[tool.setuptools.packages.find]
include = ["srai_math*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
