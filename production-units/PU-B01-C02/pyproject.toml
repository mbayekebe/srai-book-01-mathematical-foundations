[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srai-math-pu-b01-c02"
version = "1.0.0"
description = "Controlled utilities for SRAI PU-B01-C02"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.0,<4"]

[tool.setuptools.packages.find]
include = ["srai_math*"]
