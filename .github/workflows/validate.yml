name: Validate canonical notebook

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependency
        run: python -m pip install "numpy>=1.26,<3"
      - name: Validate notebook code and canonical outputs
        run: python scripts/validate_notebook.py
