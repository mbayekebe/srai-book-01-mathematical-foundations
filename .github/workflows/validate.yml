name: Validate Book 1 production units

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate ${{ matrix.production_unit }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        production_unit:
          - PU-B01-C01
          - PU-B01-C02

    defaults:
      run:
        working-directory: production-units/${{ matrix.production_unit }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install controlled dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate canonical notebook and outputs
        run: python scripts/validate_notebook.py
